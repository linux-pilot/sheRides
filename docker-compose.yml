services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    # No host port: only the server talks to Mongo, over the compose network.

  server:
    build: ./server
    env_file: .env
    ports:
      - "5050:5000" # host 5050: macOS AirPlay Receiver owns host port 5000
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo
      - mailpit

  # Local SMTP server for emails (SOS, trip sharing, ride updates). Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      # Empty = the site reaches the API through its own /api path (proxied by Vite).
      - VITE_API_URL=${VITE_API_URL:-}
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongo_data:
